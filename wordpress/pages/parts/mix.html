<!-- wp:html -->
<!--
  FIKA Mix your own: second Custom HTML block, placed directly under the hero block.
  A horizontally scrolling row of candies (arrows, swipe, drag).
-->
<style>
@import url('https://fonts.googleapis.com/css2?family=Fanwood+Text&family=Outfit:wght@400;500&display=swap');
/* ================= MIX YOUR OWN PAGE ================= */
.mx-page, .mx-fab, .mx-drawer, .mx-veil { --fika-blue:#004aad; box-sizing:border-box; }
.mx-page { --g:10%; }   /* shared left edge: heading, count and first card line up (same as the hero text) */
.mx-page * , .mx-drawer *, .mx-fab { box-sizing:border-box; }
.mx-page { position:relative; width:100vw; max-width:100vw; margin-left:calc(50% - 50vw); background:#fff; padding:40px 0 90px; overflow:hidden; }
.mx-head { display:flex; align-items:flex-end; gap:26px; padding:0 0 0 var(--g); }
.mx-h1 { font-family:'NF Le Petit Cochon',cursive; font-variant:small-caps; font-weight:400; font-size:clamp(34px,4.35vw,92px); line-height:1.1; color:var(--fika-blue); margin:0; }
.mx-link { font-family:'Fanwood Text',Georgia,serif; font-variant:small-caps; font-size:clamp(15px,1.15vw,22px); color:var(--fika-blue); text-decoration:underline; padding-bottom:12px; }
.mx-link:hover { color:#003a8a; }
.mx-count { font-family:'Open Sans','Segoe UI',Arial,sans-serif; font-size:18px; color:var(--fika-blue); padding:40px 1% 24px var(--g); }
.mx-img { aspect-ratio:1/1; position:relative; display:flex; align-items:center; justify-content:center; background:#fff; overflow:hidden; }
.mx-img img { width:84%; height:84%; object-fit:contain; transition:transform .35s ease; }
.mx-card:hover .mx-img img { transform:scale(1.05); }
.mx-ph { position:absolute; inset:0; }
.mx-ph i { position:absolute; width:19%; height:11%; border-radius:40% 40% 38% 38%; background:hsl(var(--h) 85% 62%); box-shadow:inset 0 -4px 0 rgba(0,0,0,.08), inset 0 4px 0 rgba(255,255,255,.35); transform:rotate(var(--r)); left:var(--x); top:var(--y); }
.mx-badge { position:absolute; left:0; top:21px; z-index:2; background:var(--fika-blue); color:#fff; font-family:'Fanwood Text',Georgia,serif; font-variant:small-caps; font-size:15px; letter-spacing:.02em; padding:8px 11px; line-height:21px; }
/* card: only the photo is boxed, details sit underneath, centred */
.mx-card { display:flex; flex-direction:column; align-items:stretch; position:relative; }
.mx-img { border:1px solid #d6d6d6; transition:box-shadow .25s ease, border-color .25s; }
.mx-card:hover .mx-img { box-shadow:0 10px 28px rgba(0,74,173,.12); border-color:#b8c8e6; }
.mx-card.has .mx-img { border-color:var(--fika-blue); }
.mx-body { padding:26px 6px 0; display:flex; flex-direction:column; align-items:center; gap:14px; text-align:center; }
.mx-name { font-family:'Outfit','Open Sans',Arial,sans-serif; font-weight:500; font-variant:normal; font-size:clamp(18px,1.35vw,26px); color:var(--fika-blue); margin:0; line-height:1.2; }
.mx-price { font-family:'Outfit','Open Sans',Arial,sans-serif; font-size:clamp(15px,1vw,19px); color:var(--fika-blue); }
.mx-add { border:0; cursor:pointer; background:#fff; color:#1b1b1b; font-family:'Outfit','Open Sans',Arial,sans-serif; font-variant:small-caps; font-size:17px; letter-spacing:.03em; padding:17px 20px; min-width:118px; border-radius:999px; box-shadow:0 4px 18px rgba(0,0,0,.13); transition:transform .2s, box-shadow .2s; }
.mx-add:hover { transform:translateY(-2px); box-shadow:0 8px 22px rgba(0,74,173,.22); }
.mx-pill { display:flex; align-items:center; background:#fff; border-radius:999px; box-shadow:0 4px 18px rgba(0,0,0,.13); padding:6px; }
.mx-pill button { width:42px; height:42px; border-radius:50%; border:0; background:var(--fika-blue); color:#fff; font-size:22px; cursor:pointer; line-height:1; transition:transform .15s; }
.mx-pill button:active { transform:scale(.88); }
.mx-pill span { min-width:74px; text-align:center; font-family:'Outfit','Open Sans',Arial,sans-serif; font-size:17px; color:var(--fika-blue); }
.mx-empty { grid-column:1/-1; padding:50px 0; text-align:center; font-family:'Fanwood Text',Georgia,serif; font-size:22px; color:var(--fika-blue); }

.mx-fab { position:fixed; right:22px; bottom:22px; z-index:1002; background:var(--fika-blue); color:#fff; border:0; cursor:pointer; padding:14px 22px; display:flex; align-items:center; gap:10px; font-family:'Open Sans','Segoe UI',Arial,sans-serif; font-size:16px; box-shadow:0 12px 30px rgba(0,74,173,.35); }
.mx-fab svg { width:22px; height:22px; }
.mx-fab b { background:#fff; color:var(--fika-blue); padding:2px 9px; font-weight:600; }
.mx-fab.bump { animation:mxBump .45s ease; }
@keyframes mxBump { 0%{transform:scale(1)} 40%{transform:scale(1.1)} 100%{transform:scale(1)} }
.mx-veil { position:fixed; inset:0; background:rgba(10,25,60,.45); z-index:1003; opacity:0; pointer-events:none; transition:opacity .3s; }
.mx-veil.on { opacity:1; pointer-events:auto; }
.mx-drawer { position:fixed; top:0; right:0; bottom:0; width:min(430px,100vw); background:#fff; z-index:1004; transform:translateX(105%); visibility:hidden; transition:transform .35s cubic-bezier(.2,.8,.2,1); display:flex; flex-direction:column; }
.mx-drawer.on { transform:none; visibility:visible; box-shadow:-20px 0 50px rgba(0,0,0,.2); }
.mx-dh { display:flex; justify-content:space-between; align-items:center; padding:20px 24px; background:#fdeaf2; }
.mx-dh h3 { font-family:'NF Le Petit Cochon',cursive; font-variant:small-caps; font-weight:400; font-size:32px; color:var(--fika-blue); margin:0; }
.mx-x { border:0; background:#fff; color:var(--fika-blue); width:40px; height:40px; font-size:24px; cursor:pointer; }
.mx-items { flex:1; overflow:auto; padding:8px 24px; }
.mx-line { display:flex; gap:12px; align-items:center; padding:14px 0; border-bottom:1px solid #eee; font-family:'Open Sans','Segoe UI',Arial,sans-serif; color:var(--fika-blue); }
.mx-line div:first-child { flex:1; }
.mx-line small { display:block; color:#6c7b9c; font-size:14px; }
.mx-rm { border:0; background:none; color:#a2aecb; font-size:20px; cursor:pointer; }
.mx-rm:hover { color:#d13b73; }
.mx-q { display:inline-flex; align-items:center; gap:6px; flex:none; }
.mx-qb { width:32px; height:32px; border-radius:50%; border:0; padding:0; background:var(--fika-blue); color:#fff; font:600 18px/1 'Outfit','Open Sans',Arial,sans-serif; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background .15s, transform .15s; }
.mx-qb:hover { background:#003a8a; }
.mx-qb:active { transform:scale(.9); }
.mx-q span { min-width:48px; text-align:center; font-size:14px; font-weight:600; }
.mx-lp { min-width:56px; text-align:right; flex:none; }
@media (max-width:420px) { .mx-line { gap:8px; } .mx-q { gap:4px; } .mx-q span { min-width:42px; font-size:13px; } }
.mx-none { text-align:center; padding:60px 10px; font-family:'Fanwood Text',Georgia,serif; font-size:21px; color:var(--fika-blue); }
.mx-df { padding:16px 24px 24px; border-top:1px solid #eee; font-family:'Open Sans','Segoe UI',Arial,sans-serif; color:var(--fika-blue); }
.mx-sum { display:flex; justify-content:space-between; padding:3px 0; font-size:15px; }
.mx-sum.tot { font-size:19px; font-weight:600; padding-top:10px; }
.mx-note { font-size:13px; color:#6c7b9c; margin:8px 0 14px; line-height:1.4; }
.mx-go { display:block; text-align:center; text-decoration:none; background:var(--fika-blue); color:#fff; padding:14px; font-size:16px; letter-spacing:.04em; text-transform:uppercase; }
.mx-go:hover { background:#003a8a; color:#fff; }
.mx-go[aria-disabled="true"] { opacity:.4; pointer-events:none; }
.mx-clear { display:block; margin:10px auto 0; border:0; background:none; color:#7889ad; font-size:13px; text-decoration:underline; cursor:pointer; }


/* ---- horizontal scroller ---- */
.mx-rail { position:relative; }
.mx-track { display:flex; gap:52px; overflow-x:auto; overflow-y:hidden; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; scrollbar-width:none; padding:6px 1% 18px var(--g); scroll-padding-left:var(--g); cursor:grab; overscroll-behavior-x:contain; }
.mx-track::-webkit-scrollbar { display:none; }
.mx-track.drag { cursor:grabbing; scroll-snap-type:none; scroll-behavior:auto; }
.mx-track.drag * { pointer-events:none; user-select:none; }
.mx-card { flex:0 0 calc((100% - 3 * 52px) / 4); scroll-snap-align:start; min-width:0; }
.mx-img img { -webkit-user-drag:none; user-select:none; }
.mx-nav { position:absolute; top:calc(6px + (100vw * .22)); transform:translateY(-50%); z-index:5; width:54px; height:54px; border-radius:50%; border:0; cursor:pointer; background:#fff; color:var(--fika-blue); box-shadow:0 6px 22px rgba(0,0,0,.2); font-size:30px; line-height:1; display:flex; align-items:center; justify-content:center; transition:transform .2s, opacity .25s, background .2s, color .2s; }
.mx-nav:hover { background:var(--fika-blue); color:#fff; transform:translateY(-50%) scale(1.07); }
.mx-nav.prev { left:1.2%; } .mx-nav.next { right:1.2%; }
.mx-nav[disabled] { opacity:0; pointer-events:none; }
.mx-prog { height:3px; background:#e8eefb; margin:14px 1% 0 var(--g); border-radius:3px; overflow:hidden; }
.mx-prog i { display:block; height:100%; width:25%; background:var(--fika-blue); border-radius:3px; transition:transform .15s linear; }
@media (max-width:1100px) { .mx-card { flex-basis:calc((100% - 2 * 28px) / 3); } .mx-track { gap:28px; } }
@media (max-width:700px) {
  .mx-page { --g:6%; padding-top:30px; }
  .mx-head { padding-left:6%; gap:14px; min-height:70px; flex-wrap:wrap; align-items:flex-end; }
  .mx-count { padding:18px 6% 16px; font-size:16px; }
  .mx-track { gap:14px; padding:6px 6% 16px; scroll-padding-left:6%; }
  .mx-card { flex-basis:68%; }
  .mx-body { padding-top:16px; gap:10px; }
  .mx-add { padding:13px 16px; min-width:104px; font-size:15px; }
  .mx-pill button { width:36px; height:36px; }
  .mx-pill span { min-width:48px; }
  .mx-badge { top:12px; font-size:13px; padding:6px 8px; line-height:18px; }
  .mx-nav { display:none; }
  .mx-prog { margin:6px 6% 0; }
  .mx-fab { right:14px; bottom:14px; }
}
</style>

<!-- ===== MIX YOUR OWN CONTENT ===== -->
<div class="mx-page" id="shop" style="scroll-margin-top: 130px">
  <div class="mx-head">
    <h1 class="mx-h1">Mix your own</h1>
  </div>
  <div class="mx-count" id="mxCount"></div>
  <div class="mx-rail">
    <button class="mx-nav prev" id="mxPrev" type="button" aria-label="Scroll left">‹</button>
    <div class="mx-track" id="mxGrid"></div>
    <button class="mx-nav next" id="mxNext" type="button" aria-label="Scroll right">›</button>
  </div>
  <div class="mx-prog"><i id="mxProg"></i></div>
</div>
<button class="mx-fab" id="mxFab" type="button" aria-label="Open bag">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1 12H6L5 8z"></path><path d="M9 8V6a3 3 0 0 1 6 0v2"></path></svg>
  Bag <b id="mxFabN">0 kg</b>
</button>
<div class="mx-veil" id="mxVeil"></div>
<aside class="mx-drawer" id="mxDrawer" aria-label="Your bag">
  <div class="mx-dh"><h3>Your bag</h3><button class="mx-x" id="mxClose" type="button" aria-label="Close">×</button></div>
  <div class="mx-items" id="mxItems"></div>
  <div class="mx-df">
    <div class="mx-sum"><span id="mxKg">0 kg</span><span id="mxSub">$0.00</span></div>
    <div class="mx-sum tot"><span>Total</span><span id="mxTot">$0.00</span></div>
    <a class="mx-go no-prefetch" id="mxGo" rel="nofollow" href="/checkout/" aria-disabled="true">Checkout</a>
    <button class="mx-clear" id="mxClear" type="button">Empty bag</button>
  </div>
</aside>

<script>
(function () {
  try {
  var PRICE_100G = 2.8, DELIVERY = 5, STEP = 100, CHECKOUT_URL = '/checkout/';
  // Pull candies automatically from WooCommerce (add a product in WordPress and it appears here).
  // Price of each product = price per 100g. A product tagged or categorised "pork gelatin" gets the blue tab.
  var AUTO_FROM_WOOCOMMERCE = true;
  var GELATIN_WORD = 'gelatin';   // any tag/category containing this word marks pork gelatin

  // ======== YOUR CANDY LIST (name, gelatin true = contains pork gelatin, desc not shown, img = photo URL) ========
  var PRODUCTS = [
    { name:'Fizzy Cola',      gelatin:true,  img:'' },
    { name:'Loose Teeth',     gelatin:true,  img:'' },
    { name:'Fizzy Pop',       gelatin:true,  img:'' },
    { name:'Raspberry Bites', gelatin:true,  img:'' },
    { name:'Sample candy 5',  gelatin:false, img:'' },
    { name:'Sample candy 6',  gelatin:false, img:'' },
    { name:'Sample candy 7',  gelatin:false, img:'' },
    { name:'Sample candy 8',  gelatin:false, img:'' }
  ];

  var grid = document.getElementById('mxGrid');
  if (!grid) return;
  if (window.fikaMxTitle) { var mxH1 = document.querySelector('#shop .mx-h1'); if (mxH1) mxH1.textContent = window.fikaMxTitle; }
  var KEY = 'fika_bag_v1', bag = {}, meta = {};
  var $ = function (id) { return document.getElementById(id); };
  PRODUCTS.forEach(function (p, i) { p.id = 'p' + i; p.hue = (i * 47 + 330) % 360; });
  function loadBag() { try { var s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s) { bag = s.bag || {}; meta = s.meta || {}; } } catch (e) {} }
  loadBag();
  // The bag is shared with the Ready-Mix block: items keep their own name and price per 100g
  function save() {
    Object.keys(bag).forEach(function (id) { var p = byId(id); if (p.name) meta[id] = { name: p.name, price: p.price || PRICE_100G }; });
    Object.keys(meta).forEach(function (id) { if (!bag[id]) delete meta[id]; });
    try { localStorage.setItem(KEY, JSON.stringify({ bag: bag, meta: meta })); } catch (e) {}
    try { window.dispatchEvent(new CustomEvent('fikabag', { detail: 'mix' })); } catch (e) {}
  }
  window.addEventListener('fikabag', function (e) { if (e.detail === 'mix') return; loadBag(); render(); });
  function money(n) { return '$' + n.toFixed(2); }
  function gText(g) { return g >= 1000 ? (g / 1000) + ' kg' : g + 'g'; }
  function cost() { var c = 0; for (var k in bag) c += bag[k] / 100 * (byId(k).price || PRICE_100G); return c; }
  function total() { var t = 0; for (var k in bag) t += bag[k]; return t; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function byId(id) { for (var i = 0; i < PRODUCTS.length; i++) if (PRODUCTS[i].id === id) return PRODUCTS[i]; return meta[id] || {}; }
  function pixel(ev, x) { try { if (typeof window.fikaTrack === 'function') window.fikaTrack(ev, x); else if (typeof window.fbq === 'function') window.fbq('track', ev, x); } catch (e) {} }

  function img(p) {
    if (p.img) return '<img loading="lazy" decoding="async" src="' + esc(p.img) + '"' + (p.srcset ? ' srcset="' + esc(p.srcset) + '" sizes="(max-width: 700px) 46vw, 300px"' : '') + ' alt="' + esc(p.name) + '">';
    var s = '';
    for (var i = 0; i < 7; i++) s += '<i style="--x:' + (22 + ((i * 29 + p.hue) % 46)) + '%;--y:' + (24 + ((i * 41 + p.hue / 2) % 46)) + '%;--r:' + (((i * 67 + p.hue) % 120) - 60) + 'deg"></i>';
    return '<div class="mx-ph" style="--h:' + p.hue + '">' + s + '</div>';
  }
  function renderGrid() {
    var view = window.fikaMxView ? window.fikaMxView(PRODUCTS) : PRODUCTS;
    $('mxCount').textContent = window.fikaMxCount ? window.fikaMxCount(PRODUCTS, view) : PRODUCTS.length + ' products';
    var keep = grid.scrollLeft;
    grid.innerHTML = view.map(function (p) {
      if (p.html) return p.html;
      var g = bag[p.id] || 0;
      return '<article class="mx-card' + (g ? ' has' : '') + '" data-id="' + p.id + '"><div class="mx-img">' +
        (p.gelatin ? '<span class="mx-badge">Pork Gelatin</span>' : '') + img(p) + '</div>' +
        '<div class="mx-body"><h3 class="mx-name">' + esc(p.name) + '</h3><div class="mx-price">' + money(p.price || PRICE_100G) + '</div>' +
        (g ? '<div class="mx-pill"><button type="button" data-a="-" aria-label="Less">&minus;</button><span>' + gText(g) + '</span><button type="button" data-a="+" aria-label="More">+</button></div>'
           : '<button type="button" class="mx-add" data-a="+">Add to bag</button>') + '</div></article>';
    }).join('');
    grid.style.scrollBehavior = 'auto'; grid.scrollLeft = keep; grid.style.scrollBehavior = '';
    place();
  }

  // ---- horizontal scroll: arrows, drag, progress ----
  var prev = $('mxPrev'), next = $('mxNext'), prog = $('mxProg');
  function place() {
    var max = grid.scrollWidth - grid.clientWidth, x = grid.scrollLeft;
    prev.disabled = x < 4; next.disabled = x > max - 4;
    var w = Math.max(8, grid.clientWidth / Math.max(grid.scrollWidth, 1) * 100);
    prog.style.width = w + '%';
    prog.style.transform = 'translateX(' + (max > 0 ? (x / max) * (100 / w * 100 - 100) : 0) + '%)';
    var img0 = grid.querySelector('.mx-img');
    if (img0) { var top = img0.offsetTop + img0.offsetHeight / 2; prev.style.top = next.style.top = top + 'px'; }
  }
  function by(dir) { var c = grid.querySelector('.mx-card'); var step = c ? c.getBoundingClientRect().width + parseFloat(getComputedStyle(grid).columnGap || 0) : grid.clientWidth * .8; grid.scrollBy({ left: dir * step * (window.innerWidth > 1100 ? 2 : 1), behavior: 'smooth' }); }
  prev.addEventListener('click', function () { by(-1); });
  next.addEventListener('click', function () { by(1); });
  grid.addEventListener('scroll', place, { passive: true });
  window.addEventListener('resize', place);
  var down = false, sx = 0, sl = 0, moved = false;
  grid.addEventListener('pointerdown', function (e) { if (e.pointerType !== 'mouse' || e.target.closest('button')) return; down = true; moved = false; sx = e.clientX; sl = grid.scrollLeft; });
  window.addEventListener('pointermove', function (e) { if (!down) return; var dx = e.clientX - sx; if (Math.abs(dx) > 4) { moved = true; grid.classList.add('drag'); } if (moved) grid.scrollLeft = sl - dx; });
  window.addEventListener('pointerup', function () { if (!down) return; down = false; if (grid.classList.contains('drag')) { grid.classList.remove('drag'); var c = grid.querySelector('.mx-card'); if (c) { var st = c.getBoundingClientRect().width + parseFloat(getComputedStyle(grid).columnGap || 0); grid.scrollTo({ left: Math.round(grid.scrollLeft / st) * st, behavior: 'smooth' }); } } });
  grid.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-a]'); if (!b) return;
    var id = b.closest('.mx-card').getAttribute('data-id'), cur = bag[id] || 0;
    if (b.getAttribute('data-a') === '+') { bag[id] = cur + STEP; bump(); pixel('AddToCart', { value: byId(id).price || PRICE_100G, currency: 'USD', content_name: byId(id).name, content_ids: [String(id).replace(/\D/g, '')] }); }
    else { bag[id] = Math.max(0, cur - STEP); if (!bag[id]) delete bag[id]; }
    save(); render();
  });

  var drawer = $('mxDrawer'), veil = $('mxVeil'), fab = $('mxFab');
  function openD() { drawer.classList.add('on'); veil.classList.add('on'); }
  function closeD() { drawer.classList.remove('on'); veil.classList.remove('on'); }
  function bump() { fab.classList.remove('bump'); void fab.offsetWidth; fab.classList.add('bump'); }
  fab.addEventListener('click', openD); veil.addEventListener('click', closeD); $('mxClose').addEventListener('click', closeD);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeD(); });
  document.addEventListener('click', function (e) { if (e.target.closest('.fika-cart')) { e.preventDefault(); openD(); } });
  $('mxClear').addEventListener('click', function () { bag = {}; save(); render(); });
  $('mxItems').addEventListener('click', function (e) {
    // − / + change the amount: candies in 100 g steps, Ready-Mix one 500 g bag at a time
    var q = e.target.closest('.mx-qb');
    if (q) {
      var qid = q.getAttribute('data-id'), st = /^r/.test(qid) ? 500 : 100;
      bag[qid] = (bag[qid] || 0) + (q.getAttribute('data-q') === '+' ? st : -st);
      if (!(bag[qid] > 0)) delete bag[qid];
      save(); render(); return;
    }
    var b = e.target.closest('.mx-rm'); if (!b) return; delete bag[b.getAttribute('data-id')]; save(); render();
  });
  $('mxGo').setAttribute('href', CHECKOUT_URL);
  // Checkout: copy the bag into the WooCommerce cart, then open the WooCommerce checkout.
  // Candies are priced per 100 g (1 = 100 g); Ready-Mix per 500 g bag (1 = one bag).
  // (Written without the logical-and operator and the less-than sign: WordPress rewrites them.)
  var going = false, SENT_KEY = 'fika_sent_v1';
  function cartLines() {
    var lines = [];
    Object.keys(bag).forEach(function (id) {
      var m = /^(r?)w(\d+)$/.exec(id);
      if (!m) return;
      var q = Math.round(bag[id] / (m[1] ? 500 : 100));
      if (q > 0) lines.push({ id: parseInt(m[2], 10), quantity: q });
    });
    return lines;
  }
  function storeBatch(nonce, reqs) {
    reqs.forEach(function (r) { r.headers = { Nonce: nonce }; });
    return fetch('/wp-json/wc/store/v1/batch', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json', 'Nonce': nonce },
      body: JSON.stringify({ requests: reqs })
    }).then(function (r) { if (!r.ok) throw new Error('batch ' + r.status); return r.json(); })
      .then(function (d) {
        (d.responses || []).forEach(function (x) {
          if (x.status >= 400) throw new Error((x.body ? x.body.message : '') || ('cart ' + x.status));
        });
      });
  }
  function sendToCheckout() {
    var lines = cartLines(), btn = $('mxGo'), label = btn.textContent;
    if (!lines.length) return;
    going = true; btn.textContent = 'One moment…'; btn.setAttribute('aria-busy', 'true');
    fetch('/wp-json/wc/store/v1/cart', { credentials: 'same-origin' })
      .then(function (r) {
        if (!r.ok) throw new Error('cart ' + r.status);
        var n = r.headers.get('Nonce') || r.headers.get('X-WC-Store-API-Nonce');
        return r.json().then(function (c) { return { n: n, codes: (c.coupons || []).map(function (x) { return x.code; }) }; }, function () { return { n: n, codes: [] }; });
      })
      .then(function (st) {
        var nonce = st.n;
        var reqs = [{ method: 'DELETE', path: '/wc/store/v1/cart/items' }];
        lines.forEach(function (l) { reqs.push({ method: 'POST', path: '/wc/store/v1/cart/add-item', body: l }); });
        var chain = Promise.resolve();
        for (var i = 0; reqs.length > i; i += 25) {
          (function (part) { chain = chain.then(function () { return storeBatch(nonce, part); }); })(reqs.slice(i, i + 25));
        }
        st.codes.forEach(function (code) {
          chain = chain.then(function () { return storeBatch(nonce, [{ method: 'POST', path: '/wc/store/v1/cart/apply-coupon', body: { code: code } }]).catch(function () {}); });
        });
        return chain;
      })
      .then(function () {
        try { localStorage.setItem(SENT_KEY, String(Date.now())); } catch (e) {}
        location.href = CHECKOUT_URL + '?fika=' + Date.now();
      })
      .catch(function (err) {
        going = false; btn.textContent = label; btn.removeAttribute('aria-busy');
        try { console.log('[FIKA checkout]', err); } catch (e) {}
        alert('Sorry, we could not open the checkout. Please try again, or order on WhatsApp: 79 411 565.');
      });
  }
  $('mxGo').addEventListener('click', function (e) {
    e.preventDefault();
    var sub = cost(); if (!sub) return;
    if (going) return;
    pixel('InitiateCheckout', { value: sub, currency: 'USD', num_items: Object.keys(bag).length, content_ids: Object.keys(bag).map(function (k) { return k.replace(/\D/g, ''); }) });
    sendToCheckout();
  });
  // After an order is placed WooCommerce empties its cart: empty the bag as well
  (function () {
    var sent = null; try { sent = localStorage.getItem(SENT_KEY); } catch (e) {}
    if (!sent) return;
    if (!window.fetch) return;
    fetch('/wp-json/wc/store/v1/cart', { credentials: 'same-origin' })
      .then(function (r) { return r.json(); })
      .then(function (c) {
        if (c.items_count) return;
        bag = {}; save(); render();
        try { localStorage.removeItem(SENT_KEY); } catch (e) {}
      }).catch(function () {});
  })();

  function renderBag() {
    var html = '';
    Object.keys(bag).forEach(function (id) {
      var per = byId(id).price || PRICE_100G, isBag = /^r/.test(id);
      html += '<div class="mx-line"><div>' + esc(byId(id).name) + '<small>' + (isBag ? money(per * 5) + ' per 500 g bag' : money(per) + ' per 100 g') + '</small></div>' +
        '<div class="mx-q"><button class="mx-qb" data-q="-" data-id="' + id + '" type="button" aria-label="Less ' + esc(byId(id).name) + '">−</button>' +
        '<span>' + (isBag ? Math.round(bag[id] / 500) + ' × 500g' : gText(bag[id])) + '</span>' +
        '<button class="mx-qb" data-q="+" data-id="' + id + '" type="button" aria-label="More ' + esc(byId(id).name) + '">+</button></div>' +
        '<div class="mx-lp">' + money(bag[id] / 100 * per) + '</div><button class="mx-rm" data-id="' + id + '" type="button" aria-label="Remove">&times;</button></div>';
    });
    var sugRow = $('mxItems').querySelector('.mx-sug-row'), sugX = sugRow ? sugRow.scrollLeft : 0;
    $('mxItems').innerHTML = (html || '<div class="mx-none">Your bag is empty.</div>') + suggest();
    sugRow = $('mxItems').querySelector('.mx-sug-row'); if (sugRow) sugRow.scrollLeft = sugX;
    var g = total(), sub = cost(), has = g > 0;
    var kg = (g / 1000).toFixed(1).replace(/\.0$/, '') + ' kg';
    $('mxKg').textContent = kg; $('mxFabN').textContent = kg;
    $('mxSub').textContent = money(sub);  $('mxTot').textContent = money(has ? sub : 0);
    $('mxGo').setAttribute('aria-disabled', has ? 'false' : 'true');
  }
  function render() { renderGrid(); renderBag(); }
  window.fikaMxRender = render;
  // the suggestion row's arrows (computers); phones swipe
  $('mxItems').addEventListener('click', function (e) {
    var a = e.target.closest('[data-sug]'); if (!a) return;
    var row = $('mxItems').querySelector('.mx-sug-row'); if (!row) return;
    row.scrollBy({ left: parseInt(a.getAttribute('data-sug'), 10) * row.clientWidth * 0.8, behavior: 'smooth' });
  });

  // ---- "You may also like": candies like the ones in the bag ----
  // Each candy gets traits from its WooCommerce category (sweet / sour), gelatin tag and name (brand, flavour, shape);
  // candies sharing more traits with the bag score higher; ties keep the shop order (favourites first).
  // (Written without the logical-and operator and the less-than sign: WordPress rewrites them.)
  var FAM = {
    brand: [/bubs/, /tutti frutti/, /fizzy/],
    taste: [/berr|cherr|strawberr|raspberr/, /lemon|pineapple|passion/, /cola/, /melon/, /apple|pear|peach|banana/, /licorice|salty/, /toffee|bubblegum/],
    shape: [/skull/, /oval/, /fish/, /ring/, /teeth|pacifier/]
  };
  var WHY = { brand0: 'Also BUBS', brand1: 'Also Tutti Frutti', brand2: 'Also fizzy', taste0: 'Berry flavour', taste1: 'Zesty citrus', taste2: 'Cola flavour',
    taste3: 'Melon flavour', taste4: 'Fruity', taste5: 'Salty sweet', taste6: 'Creamy sweet', shape0: 'Skull shaped', shape1: 'Oval shaped', shape2: 'Fish shaped',
    shape3: 'Ring shaped', shape4: 'Fun shapes' };
  // weights: same brand 3, same flavour or shape 2.5, same sweet / sour 2, both gelatin-free 0.5
  function traits(p) {
    var n = String(p.name || '').toLowerCase(), fam = [];
    var cats = (p.cats || []).filter(function (c) { return c === 'sweet' ? true : c === 'sour'; });
    if (!p.cats) { if (/sour/.test(n)) cats.push('sour'); if (/sweet/.test(n)) cats.push('sweet'); }
    Object.keys(FAM).forEach(function (k) { FAM[k].forEach(function (re, i) { if (re.test(n)) fam.push(k + i); }); });
    return { cats: cats, gf: !p.gelatin, fam: fam };
  }
  function suggest() {
    var ids = Object.keys(bag), mine = ids.map(function (id) { return traits(byId(id)); });
    var list = PRODUCTS.filter(function (p) { return p.name ? !bag[p.id] : false; }).map(function (p, i) {
      var t = traits(p), s = 0, best = '', bestW = 0;
      function add(w, label) { s += w; if (w > bestW) { bestW = w; best = label; } }
      mine.forEach(function (b) {
        t.fam.forEach(function (f) { if (b.fam.indexOf(f) !== -1) add(f.charAt(0) === 'b' ? 3 : (f.charAt(0) === 't' ? 2.5 : 2.5), WHY[f]); });
        t.cats.forEach(function (c) { if (b.cats.indexOf(c) !== -1) add(2, c === 'sour' ? 'Also sour' : 'Also sweet'); });
        if (t.gf ? b.gf : false) add(0.5, 'Gelatin-free');
      });
      return { p: p, s: s - i * 0.01, why: best };
    }).sort(function (a, b) { return b.s - a.s; }).slice(0, 8);
    if (!list.length) return '';
    return '<div class="mx-sug"><div class="mx-sug-h"><h4>' + (ids.length ? 'You may also like' : 'Popular picks') + '</h4>' +
      '<span class="mx-sug-nav"><button type="button" data-sug="-1" aria-label="Scroll back">&lsaquo;</button><button type="button" data-sug="1" aria-label="Scroll on">&rsaquo;</button></span></div>' +
      '<div class="mx-sug-row">' + list.map(function (x) {
      var p = x.p;
      return '<div class="mx-sc"><span class="mx-sc-img">' + img(p) + '</span><b>' + esc(p.name) + '</b><small>' + esc(x.why || money(p.price || PRICE_100G) + ' per 100 g') + '</small>' +
        '<button class="mx-qb mx-sc-add" data-q="+" data-id="' + p.id + '" type="button" aria-label="Add 100 g of ' + esc(p.name) + '">+</button></div>';
    }).join('') + '</div></div>';
  }

  function fitX(el) {
    el.style.setProperty('margin-left', '0px', 'important'); el.style.setProperty('margin-right', '0px', 'important');
    el.style.setProperty('max-width', 'none', 'important');
    el.style.setProperty('width', document.documentElement.clientWidth + 'px', 'important');
    el.style.setProperty('margin-left', (-el.getBoundingClientRect().left) + 'px', 'important');
  }
  function fitAll() { try { Array.prototype.forEach.call(document.querySelectorAll('.mx-page'), fitX); place(); } catch (e) {} }
  window.addEventListener('resize', fitAll); window.addEventListener('load', fitAll);
  setTimeout(fitAll, 400); setTimeout(fitAll, 1500);
  render(); fitAll(); place(); setTimeout(place, 500);

  if (AUTO_FROM_WOOCOMMERCE && window.fetch) {
    (window.fikaProducts ? window.fikaProducts() : fetch('/wp-json/wc/store/v1/products?per_page=100&orderby=menu_order&order=asc&catalog_visibility=catalog', { credentials: 'same-origin' }))
      .then(function (r) { if (!r.ok) throw new Error('no store api'); return r.json(); })
      .then(function (list) {
        if (!list || !list.length) return;
        var ta = document.createElement('textarea');
        var dec = function (t) { ta.innerHTML = t || ''; return ta.value; };
        var items = list.filter(function (w) { return !(w.categories || []).some(function (c) { return /ready/i.test(c.slug + ' ' + c.name); }); }).map(function (w) {
          var minor = (w.prices && w.prices.currency_minor_unit != null) ? w.prices.currency_minor_unit : 2;
          var price = w.prices ? parseInt(w.prices.price, 10) / Math.pow(10, minor) : PRICE_100G;
          var labels = (w.tags || []).concat(w.categories || []).map(function (t) { return (t.name + ' ' + t.slug).toLowerCase(); }).join(' ');
          var neg = /(no|free|without|non)[ -]*(pork)?[ -]*gelatin|gelatin[ -]*(free|less)/.test(labels);
          return { id: 'w' + w.id, name: dec(w.name), gelatin: labels.indexOf(GELATIN_WORD) !== -1 && !neg,
                   img: w.images && w.images[0] ? w.images[0].src : '', srcset: w.images ? (w.images[0] ? (w.images[0].srcset || '') : '') : '', price: price || PRICE_100G, hue: (w.id * 47) % 360,
                   cats: (w.categories || []).map(function (c) { return c.slug; }) };
        });
        if (!items.length) return;
        PRODUCTS = items;
        Object.keys(bag).forEach(function (k) { if (/^[pw]/.test(k) && !byId(k).name) delete bag[k]; });
        save(); render(); place();
        try { console.log('[FIKA mix] loaded ' + items.length + ' products from WooCommerce'); } catch (e) {}
      })
      .catch(function () { try { console.log('[FIKA mix] WooCommerce not found, showing the list in the script'); } catch (e) {} });
  }
  try { console.log('[FIKA mix page] ready'); } catch (e) {}
  } catch (err) { try { console.log('[FIKA mix page] error', err); } catch (e) {} }
})();
</script>

    { name:'Ready Sour Mix',         gelatin:false, price:14, img:'' },

  var $ = function (id) { return document.getElementById(id); };
  function read() { try { var s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s) return { bag: s.bag || {}, meta: s.meta || {} }; } catch (e) {} return { bag: {}, meta: {} }; }
  function write(st) { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} try { window.dispatchEvent(new CustomEvent('fikabag', { detail: 'ready' })); } catch (e) {} }
  function money(n) { return '$' + n.toFixed(2); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function gText(g) { return g >= 1000 ? (g / 1000) + ' kg' : g + 'g'; }
  function pixel(ev, x) { try { if (typeof window.fikaTrack === 'function') window.fikaTrack(ev, x); else if (typeof window.fbq === 'function') window.fbq('track', ev, x); } catch (e) {} }
  function setIds() { PRODUCTS.forEach(function (p, i) { if (!p.id) p.id = 'r' + i; p.hue = p.hue != null ? p.hue : (i * 61 + 340) % 360; }); }
  setIds();

  function img(p) {
    if (p.img) return '<img loading="lazy" decoding="async" src="' + esc(p.img) + '"' + (p.srcset ? ' srcset="' + esc(p.srcset) + '" sizes="(max-width: 700px) 46vw, 300px"' : '') + ' alt="' + esc(p.name) + '">';
    var s = '';
    for (var i = 0; i < 7; i++) s += '<i style="--x:' + (22 + ((i * 29 + p.hue) % 46)) + '%;--y:' + (24 + ((i * 41 + p.hue / 2) % 46)) + '%;--r:' + (((i * 67 + p.hue) % 120) - 60) + 'deg"></i>';
    return '<div class="mx-ph" style="--h:' + p.hue + '">' + s + '</div>';
  }
  function sorted() { return PRODUCTS.slice(); }
  function render() {
    var st = read(), keep = grid.scrollLeft;
    $('rmCount').textContent = ''; $('rmCount').style.display = 'none';
    grid.innerHTML = sorted().map(function (p) {
      var g = st.bag[p.id] || 0;
      return '<article class="mx-card' + (g ? ' has' : '') + '" data-id="' + esc(p.id) + '"><div class="mx-img"><span class="mx-badge">' + (p.gelatin ? 'Pork Gelatin' : 'Gelatin Free') + '</span>' + img(p) + '</div>' +
        '<div class="mx-body"><h3 class="mx-name">' + esc(p.name) + '</h3><div class="mx-price">From ' + money(p.price) + '</div>' +
        (g ? '<div class="mx-pill"><button type="button" data-a="-" aria-label="Less">&minus;</button><span>' + (g / BAG_G) + ' &times; ' + BAG_G + 'g</span><button type="button" data-a="+" aria-label="More">+</button></div>'
           : '<button type="button" class="mx-add" data-a="+">Add to bag</button>') + '</div></article>';
    }).join('');
    grid.style.scrollBehavior = 'auto'; grid.scrollLeft = keep; grid.style.scrollBehavior = '';
    place();
  }
  function byId(id) { for (var i = 0; i < PRODUCTS.length; i++) if (PRODUCTS[i].id === id) return PRODUCTS[i]; return {}; }
  grid.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-a]'); if (!b) return;
    var id = b.closest('.mx-card').getAttribute('data-id'), p = byId(id), st = read(), cur = st.bag[id] || 0;
    if (b.getAttribute('data-a') === '+') {
      st.bag[id] = cur + BAG_G; st.meta[id] = { name: p.name, price: p.price / (BAG_G / 100) };
      pixel('AddToCart', { value: p.price, currency: 'USD', content_name: p.name, content_ids: [String(id).replace(/\D/g, '')] });
      var f = document.getElementById('mxFab'); if (f) { f.classList.remove('bump'); void f.offsetWidth; f.classList.add('bump'); }
    } else { st.bag[id] = Math.max(0, cur - BAG_G); if (!st.bag[id]) { delete st.bag[id]; delete st.meta[id]; } }
    write(st); render();
  });
  window.addEventListener('fikabag', function (e) { if (e.detail !== 'ready') render(); });

  // ---- horizontal scroll ----
  var prev = $('rmPrev'), next = $('rmNext'), prog = $('rmProg');
  function place() {
    var max = grid.scrollWidth - grid.clientWidth, x = grid.scrollLeft;
    prev.disabled = x < 4; next.disabled = x > max - 4;
    var w = Math.min(100, Math.max(8, grid.clientWidth / Math.max(grid.scrollWidth, 1) * 100));
    prog.style.width = w + '%';
    prog.style.transform = 'translateX(' + (max > 0 ? (x / max) * (100 / w * 100 - 100) : 0) + '%)';
    var i0 = grid.querySelector('.mx-img');
    if (i0) { var top = i0.offsetTop + i0.offsetHeight / 2; prev.style.top = next.style.top = top + 'px'; }
  }
  function step() { var c = grid.querySelector('.mx-card'); return c ? c.getBoundingClientRect().width + parseFloat(getComputedStyle(grid).columnGap || 0) : grid.clientWidth * .8; }
  prev.addEventListener('click', function () { grid.scrollBy({ left: -step() * (window.innerWidth > 1100 ? 2 : 1), behavior: 'smooth' }); });
  next.addEventListener('click', function () { grid.scrollBy({ left: step() * (window.innerWidth > 1100 ? 2 : 1), behavior: 'smooth' }); });
  grid.addEventListener('scroll', place, { passive: true });
  window.addEventListener('resize', place);
  var down = false, sx = 0, sl = 0, moved = false;
  grid.addEventListener('pointerdown', function (e) { if (e.pointerType !== 'mouse' || e.target.closest('button')) return; down = true; moved = false; sx = e.clientX; sl = grid.scrollLeft; });
  window.addEventListener('pointermove', function (e) { if (!down) return; var dx = e.clientX - sx; if (Math.abs(dx) > 4) { moved = true; grid.classList.add('drag'); } if (moved) grid.scrollLeft = sl - dx; });
  window.addEventListener('pointerup', function () { if (!down) return; down = false; if (grid.classList.contains('drag')) { grid.classList.remove('drag'); var st = step(); grid.scrollTo({ left: Math.round(grid.scrollLeft / st) * st, behavior: 'smooth' }); } });

  function fitX(el) {
    el.style.setProperty('margin-left', '0px', 'important'); el.style.setProperty('margin-right', '0px', 'important');
    el.style.setProperty('max-width', 'none', 'important');
    el.style.setProperty('width', document.documentElement.clientWidth + 'px', 'important');
    el.style.setProperty('margin-left', (-el.getBoundingClientRect().left) + 'px', 'important');
  }
  function fitAll() { try { fitX($('rmPage')); place(); } catch (e) {} }
  window.addEventListener('resize', fitAll); window.addEventListener('load', fitAll);
  setTimeout(fitAll, 400); setTimeout(fitAll, 1500);
  render(); fitAll();

  if (AUTO_FROM_WOOCOMMERCE && window.fetch) {
    (window.fikaProducts ? window.fikaProducts() : fetch('/wp-json/wc/store/v1/products?per_page=100&orderby=menu_order&order=asc&catalog_visibility=catalog', { credentials: 'same-origin' }))
      .then(function (r) { if (!r.ok) throw new Error('no store api'); return r.json(); })
      .then(function (list) {
        var ta = document.createElement('textarea'), dec = function (t) { ta.innerHTML = t || ''; return ta.value; };
        var items = list.filter(function (w) { return (w.categories || []).some(function (c) { return /ready/i.test(c.slug + ' ' + c.name); }); }).map(function (w, i) {
          var minor = (w.prices && w.prices.currency_minor_unit != null) ? w.prices.currency_minor_unit : 2;
          var labels = (w.tags || []).concat(w.categories || []).map(function (t) { return (t.name + ' ' + t.slug).toLowerCase(); }).join(' ');
          var neg = /(no|free|without|non)[ -]*(pork)?[ -]*gelatin|gelatin[ -]*(free|less)/.test(labels);
          return { id: 'rw' + w.id, name: dec(w.name), gelatin: labels.indexOf('gelatin') !== -1 && !neg,
                   img: w.images && w.images[0] ? w.images[0].src : '', srcset: w.images ? (w.images[0] ? (w.images[0].srcset || '') : '') : '', price: (w.prices ? parseInt(w.prices.price, 10) / Math.pow(10, minor) : 14) || 14, hue: (w.id * 61) % 360 };
        });
        if (!items.length) return;
        PRODUCTS = items; render(); place();
        try { console.log('[FIKA ready-mix] loaded ' + items.length + ' products from WooCommerce'); } catch (e) {}
      })
      .catch(function () { try { console.log('[FIKA ready-mix] WooCommerce not found, showing the list in the script'); } catch (e) {} });
  }
  try { console.log('[FIKA ready-mix] ready'); } catch (e) {}
  } catch (err) { try { console.log('[FIKA ready-mix] error', err); } catch (e) {} }
})();
</script>

</style>
