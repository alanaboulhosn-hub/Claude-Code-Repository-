body.woocommerce-page { --fika-blue: #004aad; --fika-pink: #fdeaf2; background: var(--fika-pink) !important; font-family: 'Outfit', 'Open Sans', Arial, sans-serif; color: #1b2a4a; }
body.woocommerce-page .hostinger-ai-page-title { display: none !important; }
body.woocommerce-page main { padding-top: 0 !important; margin-top: 0 !important; }
body.woocommerce-page .wp-block-post-content { padding-top: 0 !important; }

.fika-shopbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; max-width: 1100px; margin: 0 auto; padding: 22px 0 6px; }
.fika-shopbar .fs-logo { font-family: 'NF Le Petit Cochon', cursive; font-variant: small-caps; font-size: 48px; line-height: 1; color: var(--fika-blue); text-decoration: none; }
.fika-shopbar nav { display: flex; gap: 36px; }
.fika-shopbar nav a { font-family: 'Bebas Neue', Impact, sans-serif; font-size: 24px; letter-spacing: .02em; color: var(--fika-blue); text-decoration: none; padding: 10px 0; border-bottom: 3px solid transparent; }
.fika-shopbar nav a:hover { border-bottom-color: var(--fika-blue); }
.fika-shoptitle { max-width: 1100px; margin: 18px auto 26px; }
.fika-shoptitle h1 { font-family: 'NF Le Petit Cochon', cursive; font-variant: small-caps; font-weight: 400; font-size: clamp(36px, 4vw, 56px); line-height: 1.1; color: var(--fika-blue); margin: 0 0 6px; }
.fika-shoptitle p { font-family: 'Fanwood Text', Georgia, serif; font-variant: small-caps; font-size: 19px; margin: 0; color: #1b2a4a; }
.fika-shoptitle p a { color: var(--fika-blue); font-weight: 700; }

.fika-shopbar.fika-shopbar-center { justify-content: center; }
.fika-shoptitle .fika-back { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; font-family: 'Fanwood Text', Georgia, serif; font-variant: small-caps; font-size: 19px; font-weight: 700; color: var(--fika-blue); text-decoration: none; border-bottom: 2px solid transparent; }
.fika-shoptitle .fika-back:hover { border-bottom-color: var(--fika-blue); }

/* Delivery is priced by the Delivery area in the address (one rate per area, picked automatically),
   so WooCommerce's own "Shipping options" step is not shown */
body.woocommerce-checkout #shipping-option, body.woocommerce-checkout .wc-block-checkout__shipping-option { display: none !important; }

/* WooCommerce blocks */
body.woocommerce-page .wc-block-components-title, body.woocommerce-page .wc-block-components-checkout-step__title,
body.woocommerce-page .wc-block-cart__totals-title, body.woocommerce-page .wc-block-components-order-summary .wc-block-components-panel__button {
  font-family: 'Bebas Neue', Impact, sans-serif !important; font-weight: 400 !important; font-size: 26px !important; letter-spacing: .03em; color: var(--fika-blue) !important; text-transform: none; }
body.woocommerce-page .wp-block-woocommerce-checkout-fields-block, body.woocommerce-page .wc-block-cart-items,
body.woocommerce-page .wp-block-woocommerce-checkout-totals-block, body.woocommerce-page .wp-block-woocommerce-cart-totals-block {
  background: #fff; border-radius: 22px; padding: 26px 28px !important; box-shadow: 0 6px 24px rgba(0, 74, 173, .08); }
body.woocommerce-page .wp-block-woocommerce-checkout-totals-block .wc-block-components-order-summary,
body.woocommerce-page .wp-block-woocommerce-checkout-order-summary-block { border: 0 !important; }
body.woocommerce-page .wc-block-components-text-input input, body.woocommerce-page .wc-block-components-combobox input,
body.woocommerce-page .wc-blocks-components-select select, body.woocommerce-page .wc-block-components-textarea {
  border-radius: 12px !important; border-color: #c9d4ea !important; font-family: 'Outfit', Arial, sans-serif !important; }
body.woocommerce-page .wc-block-components-text-input input:focus, body.woocommerce-page .wc-blocks-components-select select:focus {
  border-color: var(--fika-blue) !important; box-shadow: 0 0 0 1px var(--fika-blue) !important; }
body.woocommerce-page .wc-block-components-radio-control--highlight-checked::after,
body.woocommerce-page .wc-block-components-radio-control--highlight-checked .wc-block-components-radio-control-accordion-option--checked-option-highlighted,
body.woocommerce-page .wc-block-components-radio-control__option--checked-option-highlighted { border-color: var(--fika-blue) !important; box-shadow: none !important; }
body.woocommerce-page .wc-block-components-radio-control--highlight-checked .wc-block-components-radio-control-accordion-option--checked-option-highlighted,
body.woocommerce-page .wc-block-components-radio-control__option--checked-option-highlighted { box-shadow: inset 0 0 0 1.5px var(--fika-blue) !important; }
body.woocommerce-page input[type=radio]:checked, body.woocommerce-page .wc-block-components-radio-control__input:checked { border-color: var(--fika-blue) !important; }
body.woocommerce-page .wc-block-components-radio-control__input:checked::before { background: var(--fika-blue) !important; }
body.woocommerce-page .wc-block-components-checkbox__input:checked { background: var(--fika-blue) !important; border-color: var(--fika-blue) !important; }
body.woocommerce-page .wc-block-components-checkout-place-order-button, body.woocommerce-page .wc-block-cart__submit-button,
body.woocommerce-page .wc-block-components-button.contained {
  background: var(--fika-blue) !important; color: #fff !important; border: 0 !important; border-radius: 999px !important;
  font-family: 'Outfit', Arial, sans-serif !important; font-weight: 600 !important; letter-spacing: .04em; text-transform: uppercase; min-height: 54px; }
body.woocommerce-page .wc-block-components-checkout-place-order-button:hover, body.woocommerce-page .wc-block-cart__submit-button:hover { background: #003a8a !important; }
body.woocommerce-page .wc-block-components-order-summary-item__quantity { background: var(--fika-blue) !important; color: #fff !important; border-color: #fff !important; }
body.woocommerce-page .wc-block-components-product-details { color: var(--fika-blue); font-weight: 600; }
body.woocommerce-page .wc-block-components-totals-footer-item .wc-block-components-totals-item__value,
body.woocommerce-page .wc-block-components-totals-footer-item .wc-block-components-totals-item__label { color: var(--fika-blue); font-weight: 700; }
body.woocommerce-page a { color: var(--fika-blue); }
.fika-shophelp { max-width: 1100px; margin: 34px auto 60px; text-align: center; font-family: 'Fanwood Text', Georgia, serif; font-variant: small-caps; font-size: 18px; }
.fika-shophelp a { font-weight: 700; }
@media (max-width: 700px) {

  .fika-shopbar .fs-logo { font-size: 38px; }
  .fika-shopbar nav { gap: 22px; }
  .fika-shopbar nav a { font-size: 21px; }
  body.woocommerce-page .wp-block-woocommerce-checkout-fields-block, body.woocommerce-page .wc-block-cart-items,
  body.woocommerce-page .wp-block-woocommerce-checkout-totals-block, body.woocommerce-page .wp-block-woocommerce-cart-totals-block { padding: 20px 16px !important; border-radius: 18px; }
