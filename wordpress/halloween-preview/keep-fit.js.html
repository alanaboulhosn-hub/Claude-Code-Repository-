<script>
(function () {
  // the shop stretches the hero, its sections and the shop grids edge to edge for each screen (header part script);
  // the captured copy holds the capture window's width, so the preview does the same again for this screen
  function fitX(el) {
    el.style.setProperty('margin-left', '0px', 'important');
    el.style.setProperty('margin-right', '0px', 'important');
    el.style.setProperty('max-width', 'none', 'important');
    el.style.setProperty('width', document.documentElement.clientWidth + 'px', 'important');
    el.style.setProperty('margin-left', (-el.getBoundingClientRect().left) + 'px', 'important');
  }
  function fit() { [].slice.call(document.querySelectorAll('.fika-hero, .fika-sec, .mx-page')).forEach(fitX); }
  // the shop's filter bar (Mix your own) sticks right under the header, whose height changes as you scroll
  function stick() {
    var h = document.querySelector('.fika-header'); if (!h) return;
    var t = Math.round(h.getBoundingClientRect().bottom) - 1;
    [].slice.call(document.querySelectorAll('.fs-bar')).forEach(function (b) { b.style.setProperty('top', t + 'px', 'important'); });
  }
  fit(); stick();
  window.addEventListener('scroll', stick, { passive: true });
  window.addEventListener('resize', function () { fit(); stick(); }); window.addEventListener('load', stick);
  setTimeout(fit, 400); setTimeout(fit, 1500);
})();
</script>
