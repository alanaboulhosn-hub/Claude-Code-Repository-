.fika-bite .fb-fish .fb-mouth {
  background: radial-gradient(ellipse at 60% 50%, #ff8fb3 0 28%, #7a1030 34% 100%);
  inset: auto; left: 12.0%; top: 19.3%; width: 20%; height: 12%; border-radius: 50%;
  transform-origin: 50% 50%; transform: rotate(45deg) scale(0);
  animation: fbMouth .56s ease-in-out both;
}
@keyframes fbMouth { 0% { transform: rotate(45deg) scale(.2, 0); } 22% { transform: rotate(45deg) scale(1.15, 1.6); } 38% { transform: rotate(45deg) scale(.6, 0); } 52% { transform: rotate(45deg) scale(1, 1); } 66% { transform: rotate(45deg) scale(.6, 0); } 100% { transform: rotate(45deg) scale(.2, 0); } }
.fika-bite .fb-body { clip-path: polygon(208.0% -142.4%, -142.9% 213.7%, 35.1% 389.2%, 386.1% 33.0%); }
.fika-bite .fb-jaw-a { clip-path: polygon(32.5% 38.5%, -145.5% -137.0%, 29.9% -315.1%, 208.0% -139.6%); animation: fbJawA .56s ease-in-out both; }
.fika-bite .fb-jaw-b { clip-path: polygon(35.3% 35.6%, -142.7% -139.8%, -318.2% 38.2%, -140.1% 213.7%); animation: fbJawB .56s ease-in-out both; }
@keyframes fbJawA { 0% { transform: rotate(0); } 22% { transform: rotate(28deg); } 38% { transform: rotate(-3deg); } 52% { transform: rotate(16deg); } 66% { transform: rotate(-2deg); } 100% { transform: rotate(0); } }
@keyframes fbJawB { 0% { transform: rotate(0); } 22% { transform: rotate(-28deg); } 38% { transform: rotate(3deg); } 52% { transform: rotate(-16deg); } 66% { transform: rotate(2deg); } 100% { transform: rotate(0); } }
@keyframes fbLunge {
  0% { transform: translate(0, 0) scale(1); }
  22% { transform: translate(2px, 2px) scale(1.04); }
  38% { transform: translate(-3px, -3px) scale(1.14); }
  52% { transform: translate(-1px, -1px) scale(1.06); }
  66% { transform: translate(-3px, -3px) scale(1.1); }
  100% { transform: translate(0, 0) scale(1); }
}
.fika-bite .fb-nom {
  position: absolute; left: -30px; top: -26px;
  font-family: 'Bebas Neue', Impact, sans-serif; font-size: 18px; letter-spacing: .04em; line-height: 1;
  color: #004aad; white-space: nowrap;
  text-shadow: 0 0 2px #fff, 0 0 2px #fff, 1px 1px 0 #fff, -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff;
  opacity: 0; animation: fbNom .7s ease-out .2s both;
}
.fika-bite.fb-tilt .fb-nom { transform-origin: 50% 100%; }
@keyframes fbNom {
  0% { opacity: 0; transform: translate(4px, 6px) scale(.4) rotate(-12deg); }
  25% { opacity: 1; transform: translate(0, 0) scale(1.15) rotate(-8deg); }

  100% { opacity: 0; transform: translate(-2px, -16px) scale(1) rotate(-4deg); }
}
.fika-bite .fb-crumb {
  position: absolute; left: 1px; top: 0; width: 4px; height: 4px; border-radius: 1px;
  background: var(--c); box-shadow: 0 0 0 1px rgba(255,255,255,.7);
  opacity: 0; animation: fbCrumb .5s ease-out .2s both;
}
@keyframes fbCrumb {
  0% { opacity: 0; transform: translate(0, 0) scale(.4) rotate(0); }
  15% { opacity: 1; }
  100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1) rotate(var(--r)); }

<script>
(function () {
  if (window.__fikaBite) return;
  window.__fikaBite = true;
  if (window.matchMedia) { if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return; }
  var CLICKABLE = 'a, button, summary, label, select, [role="button"], input[type="submit"], input[type="button"], input[type="checkbox"], input[type="radio"], [onclick]';
  var TYPING = 'input, textarea, [contenteditable="true"]';
  var CRUMBS = [
    [-16, -14, 140, '#fff'], [-6, -20, -200, '#ffd23f'], [-20, -4, 220, '#ff6fa5'],
    [6, -16, -160, '#fff'], [-14, 6, 180, '#ff4d4d'], [-24, -18, 260, '#fdeaf2']
  ];
  var el = null, doneTimer = 0, root = document.documentElement;

  function place(x, y) { if (el) { el.style.left = (x - 3) + 'px'; el.style.top = (y - 2) + 'px'; } }
  function finish() {
    root.classList.remove('fika-biting');
    if (el) { if (el.parentNode) el.parentNode.removeChild(el); }
    el = null;
  }

  document.addEventListener('pointerdown', function (e) {
    if (e.pointerType === 'touch') return;
    if (e.button !== 0) return;
    var t = e.target;
    if (t.closest) { if (t.closest(TYPING)) { if (!t.closest(CLICKABLE)) return; } }
    var tilt = t.closest ? !!t.closest(CLICKABLE) : false;
    clearTimeout(doneTimer);
    finish();
    el = document.createElement('div');
    el.className = 'fika-bite' + (tilt ? ' fb-tilt' : '');
    el.setAttribute('aria-hidden', 'true');
    var fish = document.createElement('div');
    fish.className = 'fb-fish';
    ['fb-body', 'fb-mouth', 'fb-jaw-a', 'fb-jaw-b'].forEach(function (k) {
      var part = document.createElement('i');
      part.className = k;
      fish.appendChild(part);
    });
    el.appendChild(fish);
    var nom = document.createElement('span');
    nom.className = 'fb-nom';
    nom.textContent = 'nom!';
    el.appendChild(nom);
    CRUMBS.forEach(function (c) {
      var s = document.createElement('i');
      s.className = 'fb-crumb';
      s.style.cssText = '--dx:' + c[0] + 'px;--dy:' + c[1] + 'px;--r:' + c[2] + 'deg;--c:' + c[3];
      el.appendChild(s);
    });
    place(e.clientX, e.clientY);
    document.body.appendChild(el);
    root.classList.add('fika-biting');
    doneTimer = setTimeout(finish, 650);
  }, true);

  // The animated fish follows the mouse while it plays
  document.addEventListener('pointermove', function (e) { place(e.clientX, e.clientY); }, { passive: true });
  window.addEventListener('blur', finish);
})();
</script>

<script>
(function () {
  // Banner behaviour: 'always' (stays visible) | 'hide-on-scroll-up' | 'hide-on-scroll-down'
  var BANNER_MODE = 'always';
  // Pink Fika / Home / Shop bar: 'hide-on-scroll-up' | 'always'
  var HEADER_MODE = 'always';
  var hdHidden = false;

  try { console.log('[FIKA header] script running v8'); window.__fikaHeroRan = true; } catch (e) {}

  try { document.documentElement.classList.add('fika-js'); } catch (e) {}
  var h = document.querySelector('.fika-header');
  var bn = document.querySelector('.fika-banner');
  var hero = document.querySelector('.fika-hero');
  if (!h) return;

  // Move banner and header straight under <body> so the theme's layout can't squeeze or clip them
  try {
    if (bn && bn.parentNode !== document.body) document.body.appendChild(bn);
    if (h.parentNode !== document.body) document.body.appendChild(h);
  } catch (e) {}

  var bnHidden = false;
  var lastY = 0;
  var elY = 0;
  var ticking = false;
  var canParallax = window.matchMedia && window.matchMedia('(hover: hover)').matches;

  // Works whether the page scrolls normally or inside a theme container
  document.addEventListener('scroll', function (e) {
    var t = e.target;
    if (t && t !== document && typeof t.scrollTop === 'number' && t.clientHeight >= window.innerHeight * 0.5) elY = t.scrollTop;
    onScroll();
  }, true);
  function getY() {
    return Math.max(
      window.pageYOffset || 0,
      document.documentElement ? document.documentElement.scrollTop || 0 : 0,
      document.body ? document.body.scrollTop || 0 : 0,
      elY,
      heroY()
    );
  }
  // Position measured from the hero itself: works whatever element the theme scrolls
  function heroY() {
    try { return hero ? Math.max(0, -hero.getBoundingClientRect().top) : 0; } catch (e) { return 0; }
  }

  function placeHeader() {
    if (bn) h.style.setProperty('--fika-banner-h', (bnHidden ? 0 : bn.offsetHeight) + 'px');
  }
  function setBanner(show) {
    if (!bn || bnHidden === !show) return;
    bnHidden = !show;
    if (bnHidden) bn.classList.add('fika-banner-hidden'); else bn.classList.remove('fika-banner-hidden');
    placeHeader();
  }

  // Stretch an element edge to edge, whatever the theme's column is doing
  function fitX(el) {
    el.style.setProperty('margin-left', '0px', 'important');
    el.style.setProperty('margin-right', '0px', 'important');
    el.style.setProperty('max-width', 'none', 'important');
    el.style.setProperty('width', document.documentElement.clientWidth + 'px', 'important');
    var left = el.getBoundingClientRect().left;
    el.style.setProperty('margin-left', (-left) + 'px', 'important');
  }
  // Remove any gap the theme leaves above the hero
  function fit() {
    if (!hero) return;
    try {
      fitX(hero);
      hero.style.setProperty('margin-top', '0px', 'important');
      var top = hero.getBoundingClientRect().top + getY();
      if (top > 0 && top < 320) hero.style.setProperty('margin-top', (-top) + 'px', 'important');
    } catch (e) {}
  }

  function update() {
    ticking = false;
    var y = getY();

    // Pink background from the very first pixel of scrolling; see-through only at the very top
    if (y > 1) h.classList.remove('fika-top'); else h.classList.add('fika-top');
    if (HEADER_MODE === 'hide-on-scroll-up') {
      var hdy = y - lastY;
      if (y <= 30) hdHidden = false;
      else if (Math.abs(hdy) > 4) hdHidden = hdy < 0;
      if (hdHidden) h.classList.add('fika-header-hidden'); else h.classList.remove('fika-header-hidden');
      h.style.setProperty('transform', hdHidden ? 'translateY(-160%)' : 'none', 'important');
      h.style.setProperty('opacity', hdHidden ? '0' : '1', 'important');
      h.style.setProperty('pointer-events', hdHidden ? 'none' : 'auto', 'important');
    }

    if (bn ? BANNER_MODE !== 'always' : false) {
      var dy = y - lastY;
      if (y <= 30) setBanner(true);
      else if (Math.abs(dy) > 4) {
        if (BANNER_MODE === 'hide-on-scroll-up') setBanner(dy > 0);
        else setBanner(dy < 0);
      }
    }
    lastY = y;

    // If the theme pushes the hero sideways after load, pull it back to the screen edge
    try { if (hero ? Math.abs(hero.getBoundingClientRect().left) > 0.5 : false) fit(); } catch (e) {}

    // Keep the photo still while the hero scrolls up over it
    try {
      var cssHolds = (window.CSS && CSS.supports && CSS.supports('animation-timeline: scroll()')) || (hero && getComputedStyle(hero).backgroundAttachment === 'fixed');
      if (hero && canParallax && !cssHolds) {
        var shift = Math.max(0, Math.min(-hero.getBoundingClientRect().top, hero.offsetHeight));
        hero.style.backgroundPosition = 'center calc(100% + ' + shift + 'px)';
      }
    } catch (e) {}
  }
  window.addEventListener('wheel', function () { setTimeout(update, 30); setTimeout(update, 200); }, { passive: true });
  window.addEventListener('touchmove', function () { setTimeout(update, 30); }, { passive: true });
  function onScroll() {
    if (!ticking) { ticking = true; window.requestAnimationFrame(update); }
  }

  function refresh() { fit(); placeHeader(); update(); }

  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', refresh);
  window.addEventListener('load', refresh);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(refresh);
  setTimeout(refresh, 400);
  setTimeout(refresh, 1500);
  setInterval(update, 250);   // safety net in case a scroll event is missed
  refresh();
})();
</script>
