<section class="fika-sec fk-vr" id="fkVideos" aria-label="Fika reviews on video">
  <h2 class="fika-h2">Loved across Lebanon</h2>
  <p class="fk-vr-sub">Real first bites from the Fika crowd</p>
  <div class="fk-vr-stage" id="fkVrStage">
CLIPS
    <button type="button" class="fk-vr-arrow fk-vr-prev" aria-label="Previous video"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button type="button" class="fk-vr-arrow fk-vr-next" aria-label="Next video"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
  <div class="fk-vr-dots" id="fkVrDots" role="tablist" aria-label="Choose a video"></div>
</section>
<style>
.fk-vr { padding: 70px 0 64px; background: #fff; overflow: hidden; text-align: center; }
.fk-vr .fika-h2 { margin: 0 0 6px; }
.fk-vr-sub { margin: 0 0 26px; font-family: 'Fanwood Text', Georgia, serif; font-variant: small-caps; font-size: 21px; color: #6c7b9c; }
.fk-vr-stage { --w: 290px; position: relative; height: calc(var(--w) * 16 / 9); max-width: 1000px; margin: 0 auto; perspective: 1400px; perspective-origin: 50% 50%; touch-action: pan-y; }
.fk-vr-card { position: absolute; top: 0; left: 50%; width: var(--w); height: 100%; margin: 0 0 0 calc(var(--w) / -2); border-radius: 26px; overflow: hidden; background: #fdeaf2; box-shadow: 0 18px 50px rgba(0, 74, 173, .18); transition: transform .7s cubic-bezier(.22, .8, .25, 1), opacity .7s ease, filter .7s ease; cursor: pointer; opacity: 0; pointer-events: none; transform: translateZ(-600px); }
.fk-vr-card video { display: block; width: 100%; height: 100%; object-fit: cover; background: #fdeaf2; pointer-events: none; }
.fk-vr-pic { position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; object-fit: cover; pointer-events: none; transition: opacity .35s ease; }
.fk-vr-card.is-mid.is-on .fk-vr-pic { opacity: 0; }
.fk-vr-card.is-mid { transform: translateX(0) translateZ(0) rotateY(0); opacity: 1; z-index: 3; cursor: default; pointer-events: auto; }
.fk-vr-card.is-left { transform: translateX(-74%) translateZ(-260px) rotateY(38deg); opacity: .5; filter: saturate(.75) brightness(.92); z-index: 2; pointer-events: auto; }
.fk-vr-card.is-right { transform: translateX(74%) translateZ(-260px) rotateY(-38deg); opacity: .5; filter: saturate(.75) brightness(.92); z-index: 2; pointer-events: auto; }
.fk-vr-card.is-far-left { transform: translateX(-120%) translateZ(-520px) rotateY(50deg); }
.fk-vr-card.is-far-right { transform: translateX(120%) translateZ(-520px) rotateY(-50deg); }
.fk-vr-card.is-left:hover, .fk-vr-card.is-right:hover { opacity: .72; }
.fk-vr-sound { position: absolute; right: 12px; bottom: 16px; z-index: 2; display: none; align-items: center; gap: 6px; height: 38px; padding: 0 14px 0 11px; border: 0; border-radius: 999px; background: rgba(0, 74, 173, .88); color: #fff; font: 600 13px/1 'Outfit', Arial, sans-serif; cursor: pointer; }
.fk-vr-card.is-mid .fk-vr-sound { display: inline-flex; }
.fk-vr-sound svg { width: 18px; height: 18px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.fk-vr-sound .on, .fk-vr.is-loud .fk-vr-sound .off { display: none; }
.fk-vr.is-loud .fk-vr-sound .on { display: inline; }
.fk-vr-bar { position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; height: 4px; background: rgba(255, 255, 255, .35); }
.fk-vr-bar i { display: block; height: 100%; width: 0; background: #ff6fa5; }
.fk-vr-arrow { position: absolute; top: 50%; z-index: 5; width: 48px; height: 48px; margin-top: -24px; padding: 0; border: 0; border-radius: 50%; background: #fff; box-shadow: 0 6px 20px rgba(0, 74, 173, .18); cursor: pointer; }
.fk-vr-arrow svg { width: 22px; height: 22px; fill: none; stroke: #004aad; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.fk-vr-arrow:hover { background: #fdeaf2; }
.fk-vr-prev { left: calc(50% - var(--w) / 2 - 24px - 230px); }
.fk-vr-next { right: calc(50% - var(--w) / 2 - 24px - 230px); }
.fk-vr-dots { display: flex; justify-content: center; gap: 8px; margin: 22px 0 0; }
.fk-vr-dots button { width: 10px; height: 10px; padding: 0; border: 0; border-radius: 999px; background: #f3c7d9; cursor: pointer; transition: width .3s ease, background .3s ease; }
.fk-vr-dots button.on { width: 28px; background: #004aad; }
@media (max-width: 760px) {
  .fk-vr { padding: 50px 0 44px; }
  .fk-vr-sub { font-size: 18px; margin-bottom: 20px; }
  .fk-vr-stage { --w: min(60vw, 270px); }
  .fk-vr-card.is-left { transform: translateX(-60%) translateZ(-220px) rotateY(34deg); }
  .fk-vr-card.is-right { transform: translateX(60%) translateZ(-220px) rotateY(-34deg); }
  .fk-vr-arrow { width: 40px; height: 40px; margin-top: -20px; }
  .fk-vr-prev { left: 8px; } .fk-vr-next { right: 8px; }
}
@media (prefers-reduced-motion: reduce) { .fk-vr-card { transition: opacity .3s ease; } }
</style>
<script>
(function () {
  var box = document.getElementById('fkVideos'), stage = document.getElementById('fkVrStage'), dotsEl = document.getElementById('fkVrDots');
  if (!box) return;
  var cards = [].slice.call(stage.querySelectorAll('.fk-vr-card')), n = cards.length, cur = 0, loud = false, seen = false;
  var vids = cards.map(function (c) { return c.querySelector('video'); });
  function start(v) { var p = v.play(); if (p ? p.catch : false) p.catch(function () {}); }
  var dots = cards.map(function (c, i) {
    var b = document.createElement('button'); b.type = 'button'; b.setAttribute('role', 'tab'); b.setAttribute('aria-label', 'Video ' + (i + 1));
    b.addEventListener('click', function () { go(i); }); dotsEl.appendChild(b); return b;
  });
  // where a clip sits from the middle one: -2 .. 2, going round
  function rel(i) { var d = (i - cur + n) % n; return d > n / 2 ? d - n : d; }
  function place() {
    cards.forEach(function (c, i) {
      var d = rel(i);
      c.className = 'fk-vr-card' + (d === 0 ? ' is-mid' : d === -1 ? ' is-left' : d === 1 ? ' is-right' : d > 0 ? ' is-far-right' : ' is-far-left') + (d === 0 ? (vids[i].paused ? '' : ' is-on') : '');
      c.setAttribute('aria-hidden', d === 0 ? 'false' : 'true');
      dots[i].classList.toggle('on', i === cur); dots[i].setAttribute('aria-selected', i === cur ? 'true' : 'false');
    });
  }
  function play() {
    vids.forEach(function (v, i) {
      if (i === cur) return;
      // a clip that has played goes back to its picture (not its first, faded-in frame), and stops loading
      if (v.currentTime ? true : !v.paused) { v.pause(); v.preload = 'none'; v.load(); }
    });
    if (!seen) return;
    var v = vids[cur];
    v.preload = 'auto';
    v.muted = !loud;
    start(v);
  }
  function go(i) { cur = (i + n) % n; place(); play(); }
  stage.querySelector('.fk-vr-prev').addEventListener('click', function () { go(cur - 1); });
  stage.querySelector('.fk-vr-next').addEventListener('click', function () { go(cur + 1); });
  cards.forEach(function (c, i) {
    c.addEventListener('click', function (e) {
      if (e.target.closest('.fk-vr-sound')) return;
      if (Date.now() - swiped > 400 ? false : true) return; // the tap that ends a swipe
      if (rel(i)) { go(i); return; }
      if (vids[i].paused) start(vids[i]); else vids[i].pause();
    });
    c.querySelector('.fk-vr-sound').addEventListener('click', function () {
      loud = !loud; box.classList.toggle('is-loud', loud); vids[cur].muted = !loud;
      if (vids[cur].paused) start(vids[cur]);
    });
    vids[i].addEventListener('playing', function () { if (i === cur) c.classList.add('is-on'); });
    vids[i].addEventListener('ended', function () { if (i === cur) go(cur + 1); });
    vids[i].addEventListener('timeupdate', function () { var v = vids[i]; if (v.duration) c.querySelector('.fk-vr-bar i').style.width = (100 * v.currentTime / v.duration) + '%'; });
  });
  // swipe on phones
  var sx = null, swiped = 0;
  stage.addEventListener('pointerdown', function (e) { sx = e.clientX; });
  stage.addEventListener('pointerup', function (e) { if (sx === null) return; var dx = e.clientX - sx; sx = null; if (Math.abs(dx) > 45) { swiped = Date.now(); go(dx > 0 ? cur - 1 : cur + 1); } });
  // plays while the carousel is on screen, pauses when it scrolls away
  if (window.IntersectionObserver) {
    new IntersectionObserver(function (en) { seen = en[0].isIntersecting; if (seen) play(); else vids[cur].pause(); }, { threshold: 0.35 }).observe(stage);
  } else { seen = true; }
  place(); play();
})();
</script>
